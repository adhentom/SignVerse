name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Check formatting
        working-directory: apps/api
        run: ruff format --check .

      - name: Type-check
        working-directory: apps/api
        run: mypy

      - name: Test
        working-directory: apps/api
        run: pytest

      - name: Test dataset and animation tooling
        env:
          PYTHONPATH: scripts
        run: python -m pytest tools/tests

      - name: Build backend wheel
        working-directory: apps/api
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/signverse-wheel

  extension:
    name: Extension quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
