<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -24 58 52">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#e2a084"/>
      <stop offset="0.55" stop-color="#d1886c"/>
      <stop offset="1" stop-color="#bd7059"/>
    </linearGradient>
    <linearGradient id="thenar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e6a98d" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#b96854" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Human palm: narrow wrist, broad knuckles, and a gently tapered heel. -->
  <path
    d="M-6-11C-1-14 6-14 11-11C19-16 30-20 40-19C45-18 48-15 49-10C50-3 50 7 47 14C43 22 35 26 26 27C17 27 9 23 3 17C-3 11-7 4-8-3C-8-7-8-9-6-11Z"
    fill="url(#skin)"
    stroke="#8d5546"
    stroke-width="0.9"
    stroke-linejoin="round"
  />

  <!-- Thenar eminence gives the thumb base its human volume. -->
  <path
    d="M1 17C4 9 10 4 18 4C27 4 35 10 37 19C32 24 24 27 15 25C8 24 4 21 1 17Z"
    fill="url(#thenar)"
  />

  <!-- Hypothenar volume keeps the little-finger side from reading as a flat icon. -->
  <path
    d="M10-8C17-14 28-18 39-17C44-17 47-14 47-10C40-9 34-6 28-2C20 4 15 11 12 19C8 12 5 1 10-8Z"
    fill="#efb096"
    opacity="0.22"
  />

  <!-- Subtle palm and knuckle creases remain readable without looking diagrammatic. -->
  <path
    d="M7 17C13 12 21 10 28 12C34 13 39 16 42 19M12-8C20-14 30-17 41-16M13 23C21 26 29 24 35 21"
    fill="none"
    stroke="#865044"
