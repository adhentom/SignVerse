    opacity="0.34"
  />

  <path
    d="M-4-8C1-11 6-11 10-9M-3 10C1 15 6 19 11 20"
    fill="none"
    stroke="#f1b69c"
    stroke-width="1.15"
    stroke-linecap="round"
    opacity="0.35"
  />
</svg>
