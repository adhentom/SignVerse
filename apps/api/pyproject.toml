[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "signverse-api"
version = "0.1.0"
description = "SignVerse AI interpretation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=2.34,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signverse_api"]

[tool.hatch.build.targets.wheel.force-include]
"resources/lexicon/lexicon.json" = "signverse_api/resources/lexicon/lexicon.json"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=signverse_api --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["signverse_api", "tests"]

[tool.coverage.run]
branch = true
source = ["signverse_api"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
